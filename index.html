<!doctype html>
<html lang="de" data-ui-style="adventurer" data-color-palette="dragonfire" data-atmosphere="ink-parchment" data-icon-set="outline-bold" data-density="comfortable" data-motion="subtle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <title>D&amp;D Charakter-Builder</title>
    <meta name="description" content="D&D 5e Charakter-Builder (Regelwerke 2014 & 2024) – Charaktere erstellen, verwalten und als PDF & JSON exportieren." />
    <meta name="theme-color" content="#14141f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Char-Builder" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("dndb.themeSelection.v1");
          var selection = raw ? JSON.parse(raw) : null;
          if (!selection && localStorage.getItem("dndb.theme") === "light") {
            selection = { uiStyle: "adventurer", colorPalette: "pastel-adventure", atmosphere: "none", iconSet: "outline-bold", density: "comfortable", motion: "subtle", fontScale: 1 };
          }
          selection = selection || { uiStyle: "adventurer", colorPalette: "dragonfire", atmosphere: "ink-parchment", iconSet: "outline-bold", density: "comfortable", motion: "subtle", fontScale: 1 };
          var root = document.documentElement;
          root.dataset.uiStyle = selection.uiStyle || "adventurer";
          root.dataset.colorPalette = selection.colorPalette || "dragonfire";
          root.dataset.atmosphere = selection.atmosphere || "ink-parchment";
          root.dataset.iconSet = selection.iconSet || "outline-bold";
          root.dataset.density = selection.density || "comfortable";
          root.dataset.motion = selection.motion || "subtle";
          root.style.setProperty("--user-font-scale", String(selection.fontScale || 1));
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CPnTiPrB.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BvghnQlx.css">
  </head>
  <body style="margin:0;background:#14141f">
    <div id="root">
      <!-- App-Shell: sofort sichtbar, bis React gemountet ist (kein weißer Bildschirm) -->
      <div id="app-shell" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#14141f;color:#ece7f5;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
        <svg viewBox="0 0 64 64" width="60" height="60" style="filter:drop-shadow(0 2px 10px rgba(212,169,76,.5))">
          <path d="M32 4 56 12v16c0 16-12 26-24 30C20 54 8 44 8 28V12z" fill="#2a2140" stroke="#d4a94c" stroke-width="3" />
          <text x="32" y="42" text-anchor="middle" font-size="22" fill="#d4a94c" font-family="Georgia, serif" font-weight="bold">20</text>
        </svg>
        <b style="color:#d4a94c;font-size:15px">D&amp;D Charakter-Builder <span id="shell-version" style="opacity:.7;font-size:11px"></span></b>
        <span id="shell-status" style="color:#9b93b8;font-size:13px">Lädt…</span>
      </div>
    </div>

    <script>
      /* ============================================================
         BOOT-PROTOKOLL: zeichnet jeden Start-Schritt auf (überlebt
         Neustarts) – damit sehen wir auf dem Gerät, WO es hängt.
         ============================================================ */
      (function () {
        var LOG_KEY = "dndb.bootlog";
        function loadLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch (e) { return []; } }
        function saveLog(l) { try { localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(-60))); } catch (e) {} }
        function t() { return new Date().toISOString().slice(11, 23); }
        function log(msg) { var l = loadLog(); l.push({ t: t(), m: msg }); saveLog(l); console.log("[BOOT]", msg); }
        function getLogText() { return loadLog().map(function (e) { return e.t + "  " + e.m; }).join("\n"); }
        window.__bootlog = { log: log, getLogText: getLogText };

        var st = document.getElementById("shell-status");
        function status(msg) { log(msg); if (st) st.textContent = msg; }
        status("HTML geladen (v1.3.1)");

        /* ============================================================
           POLYFILLS für ältere Android-WebViews
           ============================================================ */
        var O = window.Object;
        if (O && !O.fromEntries) {
          O.fromEntries = function (entries) {
            var o = {};
            for (var i = 0; i < entries.length; i++) { o[entries[i][0]] = entries[i][1]; }
            return o;
          };
        }
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function (s, r) { return this.split(s).join(r); };
        }
        if (!Promise.prototype.finally) {
          Promise.prototype.finally = function (fn) {
            return this.then(
              function (v) { return Promise.resolve(fn()).then(function () { return v; }); },
              function (e) { return Promise.resolve(fn()).then(function () { throw e; }); }
            );
          };
        }
        if (!window.globalThis) { window.globalThis = window; }
        if (!Array.prototype.flat) {
          Array.prototype.flat = function (d) {
            d = d === undefined ? 1 : d;
            var out = [];
            (function f(a, n) {
              for (var i = 0; i < a.length; i++) {
                if (Array.isArray(a[i]) && n > 0) { f(a[i], n - 1); } else { out.push(a[i]); }
              }
            })(this, d);
            return out;
          };
        }
        status("Polyfills OK");

        /* ============================================================
           NATIVE-BOOT-CLEANER (APK): alte Service Worker & Caches weg
           ============================================================ */
        try {
          var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
          if (isNative) { log("Native-App erkannt (Capacitor)"); }
          if (isNative && ("serviceWorker" in navigator)) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
              log("SW-Registrierungen entfernt: " + regs.length);
            }).catch(function () {});
            if (window.caches && window.caches.keys) {
              window.caches.keys().then(function (keys) {
                keys.forEach(function (k) { try { window.caches.delete(k); } catch (e) {} });
                log("Caches entfernt: " + keys.length);
              }).catch(function () {});
            }
          }
        } catch (e) {}

        /* ============================================================
           NOTFALL-SEITE + DIAGNOSE
           ============================================================ */
        var SHOWN = false;

        function resetAll() {
          try { localStorage.clear(); } catch (e) {}
          try {
            if (window.caches && window.caches.keys) {
              window.caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return window.caches.delete(k); }));
              }).catch(function () {});
            }
          } catch (e) {}
          try {
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {});
            }
          } catch (e) {}
          setTimeout(function () { location.reload(); }, 600);
        }

        function backupData() {
          var data = null;
          try { data = localStorage.getItem("dndb.characters.v1"); } catch (e) {}
          var box = document.getElementById("boot-backup");
          if (!box) return;
          if (data) {
            box.style.display = "block";
            box.value = data;
            box.focus(); box.select();
            document.execCommand("copy");
            try { navigator.clipboard && navigator.clipboard.writeText(data); } catch (e) {}
            document.getElementById("boot-backup-note").textContent =
              "✅ Backup wurde in die Zwischenablage kopiert. Bitte in einer Notiz/Datei speichern, DANN zurücksetzen.";
          } else {
            box.style.display = "block";
            box.value = "Keine gespeicherten Charaktere gefunden.";
            document.getElementById("boot-backup-note").textContent = "";
          }
        }

        function diagnose() {
          var ua = "";
          try { ua = navigator.userAgent || ""; } catch (e) {}
          var txt =
            "=== D&D Charakter-Builder Diagnose ===\n" +
            "Zeit: " + new Date().toISOString() + "\n" +
            "UserAgent: " + ua + "\n" +
            "appReady: " + (window.__appReady ? "ja" : "nein") + "\n" +
            "Viewport: " + (window.innerWidth || "?") + "x" + (window.innerHeight || "?") + "\n\n" +
            "--- Boot-Protokoll ---\n" +
            (getLogText() || "(leer – Inline-JS lief nicht! WebView-Problem)");
          var box = document.getElementById("boot-diag");
          if (box) {
            box.style.display = "block";
            box.value = txt;
            box.focus(); box.select();
            document.execCommand("copy");
            try { navigator.clipboard && navigator.clipboard.writeText(txt); } catch (e) {}
            document.getElementById("boot-backup-note").textContent =
              "📋 Diagnosebericht wurde kopiert – bitte in einer Nachricht an den Entwickler einfügen.";
          }
        }

        function showBootError(detail) {
          if (SHOWN) return; SHOWN = true;
          log("NOTFALL-SEITE: " + detail);
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#14141f;color:#ece7f5;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:20px;box-sizing:border-box">' +
              '<div style="font-size:40px">⚔️</div>' +
              '<h2 style="margin:0;font-size:16px">App konnte nicht geladen werden</h2>' +
              '<p style="margin:0;color:#9b93b8;max-width:320px;line-height:1.5;font-size:12px">Erst Diagnose kopieren (screenshoten/einfügen), dann neu laden oder zurücksetzen.</p>' +
              '<div style="display:flex;flex-direction:column;gap:7px;width:100%;max-width:290px">' +
                '<button onclick="diagnose()" style="background:#1e2c4a;color:#cfe0ff;border:1px solid #5b8fd6;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;font-size:13px">📋 Diagnose kopieren</button>' +
                '<button onclick="location.reload()" style="background:#d4a94c;color:#241a05;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;font-size:13px">🔄 Neu laden</button>' +
                '<button onclick="backupData()" style="background:#1a2b1e;color:#a9e0bd;border:1px solid #3f9e6a;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;font-size:13px">💾 Backup (Charaktere)</button>' +
                '<button onclick="resetAll()" style="background:#4a1d1a;color:#ffb3aa;border:1px solid #c0564a;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;font-size:13px">🗑️ Alles zurücksetzen</button>' +
              '</div>' +
              '<small id="boot-backup-note" style="color:#8fd6ab;max-width:320px;line-height:1.4;font-size:11px"></small>' +
              '<textarea id="boot-backup" style="display:none;width:100%;max-width:320px;height:80px;background:#1a1a28;color:#9b93b8;border:1px solid #333;border-radius:8px;font-size:10px;padding:6px;box-sizing:border-box" readonly></textarea>' +
              '<textarea id="boot-diag" style="display:none;width:100%;max-width:320px;height:150px;background:#10101c;color:#9fd0ff;border:1px solid #5b8fd6;border-radius:8px;font-size:10px;padding:6px;box-sizing:border-box;font-family:monospace" readonly></textarea>' +
              '<small id="boot-error" style="color:#ff8d80;max-width:320px;word-break:break-word;font-size:10px"></small>' +
            '</div>';
          var el = document.getElementById("boot-error");
          if (el && detail) el.textContent = "Fehler: " + detail;
          var sv = document.getElementById("shell-version");
          if (sv) sv.textContent = "v1.3.1";
        }

        // SOFORT bei Script-Ladefehlern / Runtime-Fehlern vor App-Start
        window.addEventListener("error", function (e) {
          log("FEHLER: " + (e && e.message ? e.message : "unbekannt"));
          if (window.__appReady) return;
          if (e && e.target && e.target.tagName === "SCRIPT") {
            showBootError("Eine benötigte Datei konnte nicht geladen werden (evtl. alter Cache).");
          } else if (e && e.target === window) {
            showBootError(e.message || "Unbekannter JavaScript-Fehler");
          }
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          log("PROMISE-FEHLER: " + String(e.reason || "?"));
          if (window.__appReady) return;
          showBootError(String(e.reason || "Unbekannter Fehler"));
        });

        // Fallback: nach 8 s ohne erfolgreichen Start
        window.setTimeout(function () {
          if (window.__appReady) return;
          var root = document.getElementById("root");
          var shell = root && root.children.length === 1 && root.children[0] && root.children[0].id === "app-shell";
          if (shell) showBootError("Zeitüberschreitung beim Start (8 s)");
        }, 8000);

        // Zu alter Browser (kein Modul-Support)?
        try {
          if (!("noModule" in HTMLScriptElement.prototype)) {
            log("BROWSER ZU ALT: keine Modul-Skripte");
            document.getElementById("root").innerHTML =
              '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#14141f;color:#ece7f5;font-family:system-ui,sans-serif;text-align:center;padding:24px">' +
              '<div style="font-size:40px">📱</div><h2 style="margin:0;font-size:16px">Browser zu alt</h2>' +
              '<p style="color:#9b93b8;font-size:13px;max-width:300px;line-height:1.5">Diese App benötigt einen aktuelleren Browser/WebView. Bitte Android System WebView aktualisieren (Play Store) oder ein neueres Gerät verwenden.</p></div>';
            SHOWN = true;
          }
        } catch (e) {}

        window.resetAll = resetAll;
        window.backupData = backupData;
        window.diagnose = diagnose;
        status("Skripte laden…");
      })();
    </script>

  </body>
</html>
